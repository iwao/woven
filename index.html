<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WOVEN — Cultural Fabric</title>
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <aside class="control-drawer" id="control-drawer" aria-label="WOVEN controls">
      <button class="drawer-toggle" id="drawer-toggle" aria-expanded="false" aria-controls="drawer-body" title="Show WOVEN controls">Controls</button>
      <div class="drawer-body" id="drawer-body">
        <p class="drawer-kicker">WOVEN CONTROLS</p>
        <section class="control-group" aria-labelledby="view-controls-title">
          <h2 id="view-controls-title">View</h2>
          <label>Color palette <select id="palette"><option value="1">No.1 — Jet black</option><option value="2">No.2 — Wisteria</option><option value="3">No.3 — Tangerine</option><option value="4">No.4 — Prussian blue</option><option value="5" selected>No.5 — Honey bronze</option></select></label>
          <label class="artist-overlay-control">Artist overlay <input class="artist-search" id="artist-search" type="search" placeholder="Type an artist name…" autocomplete="off" aria-autocomplete="list" aria-controls="artist-results" aria-expanded="false" /><div class="artist-results" id="artist-results" role="listbox" hidden></div></label>
          <select id="artist" hidden aria-hidden="true"><option value="all">No overlay</option></select>
          <label class="year-control">Year <input id="year" type="range" /><output id="year-value"></output></label>
          <button id="play-years" aria-pressed="false" title="Animate annual additions">Play years</button>
          <label class="speed-control">Animation speed <input id="animation-speed" type="range" min="0.25" max="2" value="0.65" step="0.05" /><output id="animation-speed-value">0.65×</output></label>
          <input id="zoom" type="hidden" value="0" /><output id="zoom-value" hidden></output>
          <button id="fullscreen" aria-pressed="false" title="Show canvas only in fullscreen">Fullscreen</button>
        </section>
        <section class="control-group sound-group" aria-labelledby="sound-controls-title">
          <h2 id="sound-controls-title">Sound</h2>
          <button id="sound" aria-pressed="false">Sound off</button>
          <label class="instrument-control">Glow sound <select id="glow-instrument"><option value="synth">Synth</option><option value="piano-synth">Piano (synth)</option></select></label>
          <label class="volume-control">Glow volume <input id="glow-volume" type="range" min="0" max="1" value="0.5" step="0.01" /><output id="glow-volume-value">50%</output></label>
          <label class="volume-control">Highlight volume <input id="highlight-volume" type="range" min="0" max="1" value="0.15" step="0.01" /><output id="highlight-volume-value">15%</output></label>
          <label class="volume-control">Basso continuo <input id="basso-volume" type="range" min="0" max="1" value="0.3" step="0.01" /><output id="basso-volume-value">30%</output></label>
          <label>Weave clack <select id="weave-clack"></select></label>
          <label class="volume-control">Clack volume <input id="clack-volume" type="range" min="0" max="1" value="0.1" step="0.01" /><output id="clack-volume-value">10%</output></label>
          <label class="volume-control">Reverb <input id="reverb-amount" type="range" min="0" max="1" value="0.6" step="0.01" /><output id="reverb-amount-value">60%</output></label>
        </section>
      </div>
    </aside>
    <main>
      <section class="fabric-wrap"><canvas id="fabric" aria-label="Artist relation temporal field"></canvas><div class="canvas-year" id="canvas-year" aria-live="polite" aria-label="Current year"><span class="canvas-year-digit"><span>0</span></span><span class="canvas-year-digit"><span>0</span></span><span class="canvas-year-digit"><span>0</span></span><span class="canvas-year-digit"><span>0</span></span></div><div class="legend"><span></span> Artist × Artist / Artist × Work crosses · brighter = greater relation weight · <i class="overlay-source"></i>outgoing / <i class="overlay-reverse"></i>incoming artist overlay</div></section>
      <footer><span id="metrics"></span><span id="scope" hidden></span><span>Sample asset · no live database connection</span></footer>
    </main>
    <script type="module" src="/src/app.js"></script>
  </body>
</html>
